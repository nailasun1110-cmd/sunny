<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naila Fauziah 262505010</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --dark-green: #0f2d1e;
            --rosy-brown: #bc8f8f;
            --midnight-green: #004953;
            --moss-green: #8a9a5b;
        }

        body {
            background: linear-gradient(135deg, var(--dark-green) 0%, var(--rosy-brown) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
            width: 100%;
            max-width: 600px;
        }

        .header-banner {
            background: linear-gradient(135deg, var(--dark-green), var(--midnight-green));
            color: #ffffff;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 4px solid var(--moss-green);
        }

        .header-banner h1 {
            font-weight: 800;
            letter-spacing: 1.5px;
            font-size: 2rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .form-control, .form-select {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--moss-green);
            box-shadow: 0 0 0 0.25rem rgba(138, 154, 91, 0.25);
        }

        .btn-konversi {
            background: linear-gradient(135deg, var(--midnight-green), var(--dark-green));
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-konversi:hover {
            background: linear-gradient(135deg, var(--dark-green), var(--midnight-green));
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .hasil-container {
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            padding: 20px;
            border: 2px dashed var(--moss-green);
        }

        .label-hasil {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--midnight-green), var(--moss-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-all;
            margin-top: 10px;
            transition: transform 0.3s ease;
        }

        /* Pop-up Star Animation */
        .star-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            opacity: 0;
            color: #ffd700;
            font-size: 20px;
        }

        @keyframes starPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .animate-star {
            animation: starPop 0.8s ease-out forwards;
        }
    </style>
</head>
<body>

<div class="card calculator-card">
    <div class="header-banner">
        <h1>KALKULATOR SISTEM BILANGAN</h1>
    </div>
    
    <div class="card-body p-4">
        <form id="calcForm" onsubmit="event.preventDefault(); konversikan();">
            <div class="mb-3">
                <label for="inputAngka" class="form-label fw-bold">Input Angka:</label>
                <input type="text" class="form-control" id="inputAngka" placeholder="Masukkan angka..." required>
            </div>

            <div class="mb-3">
                <label for="selectInput" class="form-label fw-bold">Dari Sistem Bilangan:</label>
                <select class="form-select" id="selectInput">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="selectHasil" class="form-label fw-bold">Ke Sistem Bilangan:</label>
                <select class="form-select" id="selectHasil">
                    <option value="2" selected>Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10">Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <button type="button" class="btn btn-konversi w-100 mb-4" onclick="konversikan()">Konversi</button>
        </form>

        <div class="hasil-container text-center">
            <div class="star-container" id="starContainer"></div>
            <span class="text-muted fw-bold d-block">Hasil Konversi:</span>
            <div class="label-hasil" id="labelHasil">-</div>
        </div>
    </div>
</div>

<script>
    function konversikan() {
        const inputVal = document.getElementById('inputAngka').value.trim();
        const fromBase = parseInt(document.getElementById('selectInput').value);
        const toBase = parseInt(document.getElementById('selectHasil').value);
        const labelHasil = document.getElementById('labelHasil');

        if (inputVal === "") {
            labelHasil.innerText = "Input Kosong";
            return;
        }

        // Konversi ke desimal
        const decimalValue = parseInt(inputVal, fromBase);

        if (isNaN(decimalValue)) {
            labelHasil.innerText = "Input Tidak Valid!";
            return;
        }

        // Konversi dari desimal ke basis tujuan
        const result = decimalValue.toString(toBase).toUpperCase();
        labelHasil.innerText = result;

        // Picu efek animasi bintang pop-up
        triggerStarBurst();
    }

    function triggerStarBurst() {
        const container = document.getElementById('starContainer');
        container.innerHTML = ''; // Bersihkan bintang sebelumnya

        const starCount = 12;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.innerHTML = '★';

            // Hitung sudut dan jarak acak untuk efek pop-up meledak
            const angle = (i / starCount) * 2 * Math.PI;
            const distance = 80 + Math.random() * 60;
            const tx = Math.cos(angle) * distance - 50 + '%';
            const ty = Math.sin(angle) * distance - 50 + '%';

            star.style.setProperty('--tx', tx);
            star.style.setProperty('--ty', ty);
            star.classList.add('animate-star');

            container.appendChild(star);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
